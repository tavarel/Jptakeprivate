[project]
name = "jp-takeprivate-radar"
version = "0.1.0"
description = "Point-in-time screen of Japanese listed companies likely to be taken private (MBO / tender offer), built on EDINET and J-Quants data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
model = ["scikit-learn>=1.5"]
app = [
    "streamlit>=1.37",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
    "types-openpyxl>=3.1.5.20260827",
]

[project.scripts]
radar = "radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "PL"]
ignore = [
    "PLR0913", # many args is fine for pure pipeline functions
    "PLR2004", # magic numbers are fine in tests and thresholds live in config
    "RUF001",  # full-width characters are intentional (Japanese text)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["radar"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["streamlit.*", "sklearn.*", "respx.*", "joblib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that hit real external APIs (skipped by default, run with -m network)",
]
